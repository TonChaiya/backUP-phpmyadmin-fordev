[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
serialize_precision = -1
expose_php = Off
max_execution_time = 0
max_input_time = 60
memory_limit = 256M
error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = "C:\ProgramData\BackupPhpMyAdmin\RuntimeData\logs\php-error.log"
variables_order = "GPCS"
request_order = "GP"
register_argc_argv = Off
auto_globals_jit = On
post_max_size = 8M
upload_max_filesize = 2M
max_file_uploads = 1
file_uploads = Off
allow_url_fopen = Off
allow_url_include = Off
enable_dl = Off
sys_temp_dir = "C:\ProgramData\BackupPhpMyAdmin\RuntimeData\temporary"
upload_tmp_dir = "C:\ProgramData\BackupPhpMyAdmin\RuntimeData\temporary"
open_basedir = "C:\Program Files\BackupPhpMyAdmin\Application;C:\Program Files\BackupPhpMyAdmin\Runtime\PHP;C:\ProgramData\BackupPhpMyAdmin\RuntimeData;C:\ProgramData\BackupPhpMyAdmin\SecretProvider"
disable_functions = "exec,passthru,shell_exec,system,popen,pcntl_exec,dl,phpinfo"
extension_dir = "C:\Program Files\BackupPhpMyAdmin\Runtime\PHP\ext"
extension = mysqli
extension = sodium

[Date]
date.timezone = "Asia/Bangkok"

[Session]
session.save_handler = files
session.save_path = "C:\ProgramData\BackupPhpMyAdmin\RuntimeData\sessions"
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
session.cookie_secure = 0
session.gc_probability = 1
session.gc_divisor = 1000
session.gc_maxlifetime = 1440

[Assertion]
zend.assertions = -1

[MySQLi]
mysqli.allow_persistent = Off
mysqli.max_persistent = 0
mysqli.default_port = 3306

