Define APACHE_ROOT "C:/Program Files/BackupPhpMyAdmin/Runtime/Apache"
Define PHP_ROOT "C:/Program Files/BackupPhpMyAdmin/Runtime/PHP"
Define APP_ROOT "C:/Program Files/BackupPhpMyAdmin/Application"
Define RUNTIME_ROOT "C:/ProgramData/BackupPhpMyAdmin/RuntimeData"

ServerRoot "${APACHE_ROOT}"
ServerName 127.0.0.1:8788
Listen 127.0.0.1:8788
PidFile "${RUNTIME_ROOT}/temporary/apache.pid"
DefaultRuntimeDir "${RUNTIME_ROOT}/temporary"
Mutex default:${RUNTIME_ROOT}/temporary

LoadModule authz_core_module "${APACHE_ROOT}/modules/mod_authz_core.so"
LoadModule authz_host_module "${APACHE_ROOT}/modules/mod_authz_host.so"
LoadModule filter_module "${APACHE_ROOT}/modules/mod_filter.so"
LoadModule reqtimeout_module "${APACHE_ROOT}/modules/mod_reqtimeout.so"
LoadModule mime_module "${APACHE_ROOT}/modules/mod_mime.so"
LoadModule log_config_module "${APACHE_ROOT}/modules/mod_log_config.so"
LoadModule dir_module "${APACHE_ROOT}/modules/mod_dir.so"
LoadModule headers_module "${APACHE_ROOT}/modules/mod_headers.so"

LoadFile "${PHP_ROOT}/libcrypto-3-x64.dll"
LoadFile "${PHP_ROOT}/libssl-3-x64.dll"
LoadModule php_module "${PHP_ROOT}/php8apache2_4.dll"
PHPIniDir "${PHP_ROOT}"

<IfModule unixd_module>
    User daemon
    Group daemon
</IfModule>

ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None
AcceptFilter http none
EnableSendfile Off
EnableMMAP Off
Timeout 300
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 3
RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500

TypesConfig "${APACHE_ROOT}/conf/mime.types"
AddType application/x-httpd-php .php
AddDefaultCharset UTF-8
DirectoryIndex index.php

DocumentRoot "${APP_ROOT}/public"
<Directory />
    AllowOverride None
    Options None
    Require all denied
</Directory>

<Directory "${APP_ROOT}/public">
    AllowOverride None
    Options None
    Require local
</Directory>

<FilesMatch "^\.">
    Require all denied
</FilesMatch>

RequestHeader unset Proxy early
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "same-origin"

ErrorLog "${RUNTIME_ROOT}/logs/apache-error.log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog "${RUNTIME_ROOT}/logs/apache-access.log" combined

<IfModule mpm_winnt_module>
    ThreadsPerChild 64
    MaxConnectionsPerChild 10000
</IfModule>
